name: CI/CD Pipeline - Build, Test & Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ----------------------------------------------------
  # Job 1: Build & Validate (CI)
  # ----------------------------------------------------
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build site (Docusaurus)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build/
          retention-days: 1

  # ----------------------------------------------------
  # Job 2: Deploy to Cloudflare Pages (CD)
  # Runs only on push to main branch
  # ----------------------------------------------------
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: build

      - name: Verify Cloudflare Secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ ERROR: 'CLOUDFLARE_API_TOKEN' secret is missing or empty in GitHub Repository Secrets!"
            echo "Please add it in: Settings -> Secrets and variables -> Actions -> Repository secrets"
            exit 1
          else
            echo "✅ CLOUDFLARE_API_TOKEN is detected."
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ ERROR: 'CLOUDFLARE_ACCOUNT_ID' secret is missing or empty in GitHub Repository Secrets!"
            exit 1
          else
            echo "✅ CLOUDFLARE_ACCOUNT_ID is detected."
          fi

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy build --project-name=codewithsarvy --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
